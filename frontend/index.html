<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="mainHeader">
      <img src="image/logo.jpg" alt="Logo" id="logoImage">
      <div class="hederButton">
        <a href="#">Dashboard </a>
        <a href="#">Expenses</a>
      </div>
    </div>
  </header>

  <main>
    <div class="containerCard">
      <div class="card" id="totalcard">
        <h7 class="title">Total expenses</h7>
        <p class="value">0.00  JOD</p>
      </div>
      <div class="card" id="countcard">
        <h7 class="title">Number of expenses</h7>
        <p class="value">0</p>
      </div>
      <div class="card" id="maxcard">
        <h7 class="title">Highest expense</h7>
        <p class="value">0.00  JOD</p>
      </div>
    </div>

    <div class="AddEspenses">
      <div class="card">
        <h6>Add expense</h6>
        <form id="expenseForm">
          <div class="Add">
            <div>
              <label for="title"> Title</label>
              <input type="text" class="form-control" id="title"required>
              <div class="invalid-feedback" id="titleError"></div>
            </div>

            <div>
              <label for="amount">Amount</label>
              <input type="number" class="form-control" id="amount" step="1"required>
              <div class="invalid-feedback" id="amountError"></div>
            </div>

            <div>
              <label for="category">Category</label>
              <select class="form-select" id="category" required>
                <option value="">Choose...</option>
                
                  <option value="Food">Food</option>
                  <option value="Bills">Bills</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                
              </select>
            </div>

            <div>
              <label for="date">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
          </div>

          <button type="submit" class="btn">Add expense</button>
        </form>
      </div>
    </div>

    <section class="tableCard">
      <div class="card">
        <div class="tableheader">
          <h4>Expenses</h4>
          <div class="categoryTable">
            <label for="categoryFilter">Category</label>
            <select class="form-select" id="categoryFilter">
              <option value="">All</option>
              <option value="Food">Food</option>
                  <option value="Bills">Bills</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Amount</th>
              <th scope="col">Category</th>
              <th scope="col">Date</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="expensesBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="editAmount" step="0.01" required>
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="">Choose...</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" form="editForm" class="btn btn-success">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
