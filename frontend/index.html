<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="mainHeader">
      <img src="image/logo.jpg" alt="Logo" id="logoImage">
      <div class="hederButton">
        <a href="#">Dashboard </a>
        <a href="#">Expenses</a>
        <a href="#">About </a>


      </div>


    </div>
  </header>
  <div class="containerCard">
      <div class="card">
        <h7 class="title">Total expenses</h7>


      </div>
      <div class="card">
        <h7 class="title">Number of expenses</h7>

      </div>
      <div class="card">
        <h7 class="title">Highest expense</h7>

      </div>
    </div>
    <div class="AddEspenses">
      <div class="card">
        <h6>Add expense</h6>
        <div class="Add">
          <div>
            <label for=""> Title</label>
            <input type="text" class="form-control" id="title" required="">
          </div>

          <div>
            <label for="">Amount</label>
            <input type="text" class="form-control" id="amount" required="">
          </div>
          <div>
            <label for="">Category</label>
            <input type="list" class="form-select" id="category" required="">
          </div>
          <div>

            <label>Date</label>
            <input type="date" class="form-control" id="date" required="">
          </div>

        </div>
        <button class="btn">Add expense</button>

      </div>
    </div>
   <table class="table table-hover" >
      <thead>
        <tr>
        <th scope="col"> Title</th>
        <th scope="col">Amount</th>
        <th scope="col">Category</th>
        <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody id="expensesBody">
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td>
            <button class="edit">Edit</button>
            <button class="remove">Remove</button>
          </td>
        </tr>

      </tbody>
    </table>

</main>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
